name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared contracts and macOS WebKit tests
        run: ./scripts/test.sh
      - name: iOS example compile
        run: xcodebuild -project Example/Example.xcodeproj -scheme Example -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
